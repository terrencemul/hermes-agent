name: Startup safety

on:
  pull_request:
  push:
    branches:
      - 'security/**'

permissions:
  contents: read

jobs:
  startup-tests:
    name: Startup regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Validate shell syntax
        run: bash -n start.sh
      - name: Run offline startup safety regressions
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
